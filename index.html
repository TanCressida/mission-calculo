<!doctype html>
<html lang="fr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="description" content="Mission Calculo, application de calcul mental pour Octave.">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black"><meta name="apple-mobile-web-app-title" content="Calculo">
<link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icon-180.png"><link rel="icon" type="image/png" href="icon-192.png">
<title>Mission Calculo</title>
<meta name="theme-color" content="#0A1330">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito:wght@600;700;800;900&display=swap">
<style>
/* Concept : une carte spatiale verticale, des planetes a conquérir, boutons épais façon jeu, nuit bleue et rouge signal. */
:root{
  --bg:#0A1330; --bg2:#101C47; --surface:#16255C; --surface2:#1F3175; --line:#33489B;
  --fg:#F4F6FF; --muted:#BAC5F3;
  --blue:#2A5CE6; --blue-d:#173FB0; --blue-l:#7C9EFF;
  --red:#D62839; --red-d:#8F1422; --red-l:#FF8791;
  --gold:#FFC93C; --gold-d:#B9861A;
  --help-bg:#E7E3FF; --help-fg:#241D74; --help-line:#7A6BE8; --good-bg:#DCE7FF; --good-fg:#0C2A8A; --bad-bg:#FFDDE1; --bad-fg:#7A0F1B;
  --f-display:'Baloo 2','Trebuchet MS',system-ui,sans-serif;
  --f-body:'Nunito',system-ui,-apple-system,'Segoe UI',sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font:700 16px/1.45 var(--f-body);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:0;overflow-x:hidden}
body::before{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;
  background:
   radial-gradient(1.6px 1.6px at 20px 30px,#fff,transparent),
   radial-gradient(1px 1px at 90px 80px,#cfd8ff,transparent),
   radial-gradient(2px 2px at 160px 20px,#fff,transparent),
   radial-gradient(1px 1px at 60px 140px,#fff,transparent),
   radial-gradient(1.6px 1.6px at 130px 120px,#ffb3ba,transparent),
   radial-gradient(ellipse 80% 40% at 50% -8%,rgba(42,92,230,.38),transparent 70%);
  background-size:200px 180px,200px 180px,200px 180px,200px 180px,200px 180px,100% 100%;opacity:.8;
  animation:twinkle 6s ease-in-out infinite alternate}
@keyframes twinkle{from{opacity:.55}to{opacity:.9}}
h1,h2,h3{font-family:var(--f-display);margin:0;line-height:1.1;text-wrap:balance}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--gold);outline-offset:3px;border-radius:12px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.app{max-width:480px;margin:0 auto;padding-block:16px 120px}
main{outline:none}
.noscroll{overflow:hidden}

/* boutons épais */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;min-height:56px;padding:12px 22px;border:0;border-radius:18px;
  background:var(--blue);color:#fff;font:800 17px var(--f-display);letter-spacing:.06em;text-transform:uppercase;
  box-shadow:0 5px 0 var(--blue-d);transition:transform .08s,box-shadow .08s}
.btn:active:not(:disabled){transform:translateY(4px);box-shadow:0 1px 0 var(--blue-d)}
.btn:disabled{background:#2A3A7E;color:#8D9BD6;box-shadow:0 5px 0 #1A2760;cursor:not-allowed}
.btn.red{background:var(--red);box-shadow:0 5px 0 var(--red-d)}
.btn.red:active:not(:disabled){box-shadow:0 1px 0 var(--red-d)}
.btn.ghost{background:transparent;color:var(--blue-l);box-shadow:none;border:2px solid var(--line)}
.btn.block{width:100%}
.icon-btn{width:48px;height:48px;border-radius:14px;border:0;background:transparent;display:grid;place-items:center;color:var(--muted)}
.icon-btn svg{width:26px;height:26px}
svg.i{width:1em;height:1em;fill:none;stroke:currentColor;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
svg.i.fill{fill:currentColor;stroke:none}

/* en-tête */
.top{display:flex;align-items:center;gap:12px}
.top .hi{flex:1;min-width:0}
.top h1{font-size:26px}
.chips{display:flex;gap:8px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:999px;background:var(--surface);border:2px solid var(--line);font:800 17px var(--f-display);font-variant-numeric:tabular-nums}
.chip svg{width:20px;height:20px}
.chip.fire svg{color:var(--red-l)} .chip.star svg{color:var(--gold)}
.lvl{margin:14px 0 4px;display:flex;flex-direction:column;gap:6px}
.lvl-row{display:flex;justify-content:space-between;font-size:14px;color:var(--muted)}
.lvl-row b{color:var(--fg)}
.meter{height:12px;border-radius:99px;background:var(--surface);border:2px solid var(--line);overflow:hidden}
.meter i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--blue),var(--blue-l));transition:width .5s}
.meter.red i{background:linear-gradient(90deg,var(--red),var(--red-l))}
.card{background:var(--surface);border:2px solid var(--line);border-radius:22px;padding:16px}
.goal{margin-top:12px;display:grid;gap:8px}
.goal .row{display:flex;justify-content:space-between;align-items:center;font-size:15px}
.goal .row span:last-child{color:var(--muted);font-variant-numeric:tabular-nums}
.speech{margin:18px 0 6px;display:flex;align-items:center;gap:12px}
.speech .b{position:relative;flex:1;background:var(--fg);color:#0A1330;border-radius:18px;padding:12px 14px;font-size:16px}
.speech .b::before{content:"";position:absolute;left:-9px;top:50%;margin-top:-9px;border:9px solid transparent;border-left:0;border-right-color:var(--fg)}
.place{margin:14px 0 0;display:flex;gap:14px;align-items:center;border-color:var(--red)}
.place p{margin:0;flex:1;font-size:15px}
.place .btn{min-height:46px;padding:8px 14px;font-size:14px}

/* carte */
.mapwrap{position:relative;width:100%;margin-top:6px}
.mapwrap svg.path{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.stop{position:absolute;transform:translate(-50%,-50%);width:150px;display:flex;flex-direction:column;align-items:center;gap:2px;text-align:center}
.planet{position:relative;width:92px;height:92px;border:0;background:none;padding:0;border-radius:50%;display:grid;place-items:center;transition:transform .12s}
.planet svg.pl{width:100%;height:100%;filter:drop-shadow(0 6px 0 rgba(0,0,0,.35))}
.planet:active:not(:disabled){transform:translateY(4px) scale(.97)}
.planet.cur::after{content:"";position:absolute;inset:-8px;border-radius:50%;border:3px solid var(--red-l);animation:pulse 1.8s ease-out infinite}
@keyframes pulse{from{transform:scale(.88);opacity:1}to{transform:scale(1.18);opacity:0}}
.planet:disabled{cursor:not-allowed;filter:grayscale(1) brightness(.55)}
.planet .lock{position:absolute;inset:0;display:grid;place-items:center;color:#fff;font-size:30px}
.stop .nm{font:800 18px var(--f-display);text-shadow:0 0 6px var(--bg),0 0 10px var(--bg)}
.stop .tt{font-size:13px;color:var(--muted);line-height:1.25;text-shadow:0 0 6px var(--bg),0 0 10px var(--bg)}
.stars3{display:flex;gap:2px;font-size:16px;color:#3A4C9E}
.stars3 .on{color:var(--gold)}
.go-bubble{position:absolute;top:-36px;left:50%;transform:translateX(-50%);background:var(--fg);color:#0A1330;font:800 14px var(--f-display);letter-spacing:.06em;text-transform:uppercase;padding:5px 12px;border-radius:12px;white-space:nowrap;animation:bob 1.6s ease-in-out infinite;pointer-events:none}
.go-bubble::after{content:"";position:absolute;left:50%;bottom:-7px;margin-left:-7px;border:7px solid transparent;border-bottom:0;border-top-color:var(--fg)}
@keyframes bob{50%{transform:translate(-50%,-4px)}}
.mf{animation:float 3.2s ease-in-out infinite;transform-origin:50% 60%}
@keyframes float{50%{transform:translateY(-3px)}}

/* navigation */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:20;display:flex;justify-content:center;
  padding:8px max(12px,env(safe-area-inset-right,0px)) calc(8px + env(safe-area-inset-bottom,0px)) max(12px,env(safe-area-inset-left,0px));
  background:linear-gradient(to top,var(--bg) 70%,transparent)}
.nav .in{display:flex;gap:8px;width:100%;max-width:480px;background:var(--bg2);border:2px solid var(--line);border-radius:22px;padding:6px}
.tab{flex:1;min-height:56px;border:2px solid transparent;border-radius:16px;background:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;color:var(--muted);font:800 13px var(--f-display);letter-spacing:.05em;text-transform:uppercase}
.tab svg{width:26px;height:26px}
.tab[aria-current="page"]{background:#1B3AA0;border-color:var(--blue-l);color:#fff}

/* pages secondaires */
.hero{display:flex;flex-direction:column;align-items:center;text-align:center;gap:10px;padding:18px 0 6px}
.hero h1{font-size:34px}
.hero p{margin:0;color:var(--muted);max-width:30ch}
.rec{display:flex;align-items:center;gap:10px;padding:12px 18px;border-radius:18px;background:var(--surface);border:2px solid var(--line);font:800 20px var(--f-display)}
.rec svg{color:var(--gold);width:26px;height:26px}
.sect{margin-top:24px;display:grid;gap:12px}
.sect h2{font-size:22px}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat{padding:12px 14px;border-radius:16px;background:var(--surface);border:2px solid var(--line)}
.stat b{display:block;font:800 26px var(--f-display);font-variant-numeric:tabular-nums}
.stat span{font-size:14px;color:var(--muted)}
.heatwrap{overflow-x:auto;border-radius:16px}
table.heat{border-collapse:separate;border-spacing:3px;width:100%;min-width:320px;font-size:13px;font-variant-numeric:tabular-nums}
table.heat th{font:800 13px var(--f-display);color:var(--muted);padding:4px 0}
table.heat td{height:34px;text-align:center;border-radius:8px;border:2px solid transparent;background:var(--surface);color:var(--muted)}
td[data-s="mid"]{background:#2C4AB0;color:#fff;border-color:#2C4AB0}
td[data-s="strong"]{background:var(--blue);color:#fff;border-color:var(--blue-l)}
td[data-s="weak"]{background:#5A1220;color:#fff;border:2px dashed var(--red-l)}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:13px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:16px;height:16px;border-radius:5px;display:inline-block;border:2px solid transparent}
.list{margin:0;padding:0;list-style:none;display:grid;gap:8px}
.list li{display:flex;justify-content:space-between;gap:12px;padding:10px 14px;border-radius:14px;background:var(--surface);border:2px solid var(--line);font-size:15px}
.list li span:last-child{color:var(--muted)}
.set{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:56px}
.set label{flex:1}
.txt{width:150px;min-height:48px;border-radius:14px;border:2px solid var(--line);background:var(--bg2);color:var(--fg);padding:8px 12px;font:800 17px var(--f-body)}
.sw{position:relative;width:68px;height:44px;border-radius:99px;border:2px solid var(--line);background:var(--bg2);padding:0;flex:none}
.sw::after{content:"";position:absolute;top:4px;left:4px;width:32px;height:32px;border-radius:50%;background:var(--muted);transition:transform .15s}
.sw[aria-checked="true"]{background:var(--blue);border-color:var(--blue-l)}
.sw[aria-checked="true"]::after{transform:translateX(24px);background:#fff}
.small{font-size:14px;color:var(--muted);margin:0}

/* leçon */
.overlay{position:fixed;inset:0;z-index:50}
.lesson{position:absolute;inset:0;display:flex;flex-direction:column;background:var(--bg);
  padding:calc(8px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) calc(12px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));
  max-width:100%;overflow:hidden}
.lesson::before{content:"";position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse 90% 40% at 50% -10%,rgba(42,92,230,.35),transparent 70%)}
.lesson>*{position:relative;width:100%;max-width:480px;margin-inline:auto}
.l-top{display:flex;align-items:center;gap:10px;flex:none}
.bar,.timer{flex:1;height:18px;border-radius:99px;background:var(--surface);border:2px solid var(--line);overflow:hidden}
.bar i{display:block;height:100%;width:0;border-radius:99px;background:linear-gradient(90deg,var(--blue),var(--blue-l));transition:width .35s}
.timer i{display:block;height:100%;width:100%;border-radius:99px;background:linear-gradient(90deg,var(--red),var(--red-l))}
.score{display:flex;align-items:center;gap:4px;font:800 22px var(--f-display);min-width:56px;color:var(--gold);font-variant-numeric:tabular-nums}
.score svg{width:22px;height:22px}
.l-body{flex:1;min-height:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;text-align:center}
.lead{margin:0;font:700 clamp(18px,5vw,22px)/1.35 var(--f-body);max-width:30ch;min-height:0}
.lead:empty{display:none}
.eq{display:flex;flex-wrap:wrap;justify-content:center;align-items:center;gap:8px 14px;font:800 clamp(40px,13vw,64px)/1 var(--f-display);font-variant-numeric:tabular-nums}
.eq .tk{white-space:nowrap}
.eq .tk.small-t{font-size:.5em;color:var(--muted)}
.blank{display:inline-grid;place-items:center;min-width:1.7em;min-height:1.25em;padding:0 .2em;border-radius:.28em;background:var(--surface);border:3px dashed var(--blue-l);color:var(--blue-l)}
.blank.has{border-style:solid;color:var(--fg);background:var(--surface2)}
.blank.ok{border-color:var(--blue-l);background:#1B3AA0;color:#fff}
.blank.bad{border-color:var(--red-l);background:#5A1220;color:#fff}
.l-input{flex:none;display:grid;grid-template-columns:minmax(0,1fr);gap:10px}
.pad{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.key{min-height:clamp(48px,8.2vh,62px);border:0;border-radius:16px;background:var(--surface2);box-shadow:0 4px 0 #101D52;font:800 28px var(--f-display);color:var(--fg);display:grid;place-items:center}
.key:active{transform:translateY(3px);box-shadow:0 1px 0 #101D52}
.key svg{width:28px;height:28px}
.key-del{grid-column:span 2}
.btn-go{grid-column:span 3;min-height:clamp(48px,8.2vh,62px)}
.choices{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.choice{min-height:clamp(70px,12vh,96px);border-radius:20px;border:3px solid var(--line);background:var(--surface);box-shadow:0 5px 0 #101D52;font:800 36px var(--f-display);font-variant-numeric:tabular-nums}
.choice[aria-pressed="true"]{border-color:var(--blue-l);background:#1B3AA0}
.choice:active{transform:translateY(3px);box-shadow:0 2px 0 #101D52}
.l-input>.btn-go{width:100%;grid-column:auto}
.sheet{position:absolute;left:0;right:0;bottom:0;max-width:none!important;margin:0!important;padding:18px max(16px,env(safe-area-inset-right,0px)) calc(18px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));border-radius:28px 28px 0 0;animation:up .22s ease-out;z-index:3}
.sheet .in{max-width:480px;margin:0 auto;display:grid;gap:14px}
.sheet .msg{display:flex;gap:14px;align-items:center}
.sheet h2{font-size:28px}
.sheet p{margin:2px 0 0;font-size:16px;font-weight:700}
.sheet.good{background:var(--good-bg);color:var(--good-fg)}
.sheet.bad{background:var(--bad-bg);color:var(--bad-fg)}
.sheet.good .btn{background:var(--blue);box-shadow:0 5px 0 var(--blue-d)}
.sheet.bad .btn{background:var(--red);box-shadow:0 5px 0 var(--red-d)}
@keyframes up{from{transform:translateY(100%)}}
.scrim{position:absolute;inset:0;z-index:5;background:rgba(5,10,30,.78);display:grid;place-items:center;padding:16px;max-width:none!important}
.dialog{width:100%;max-width:380px;background:var(--surface);border:2px solid var(--line);border-radius:26px;padding:22px;display:grid;gap:14px;text-align:center;justify-items:center}
.dialog h2{font-size:26px}.dialog p{margin:0;color:var(--muted)}
.dialog .btn{width:100%}

/* résultat */
.res{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;text-align:center}
.res h1{font-size:36px}
.res p{margin:0;color:var(--muted);max-width:32ch}
.bigstars{display:flex;gap:6px;font-size:58px}
.bigstars>span{color:#33489B}
.bigstars>.on{color:var(--gold);animation:pop .5s both}
.bigstars .on:nth-child(2){animation-delay:.25s}.bigstars .on:nth-child(3){animation-delay:.5s}
@keyframes pop{0%{transform:scale(0) rotate(-40deg)}70%{transform:scale(1.25) rotate(8deg)}100%{transform:scale(1)}}
.gains{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.gain{padding:10px 16px;border-radius:16px;border:2px solid var(--line);background:var(--surface);font:800 20px var(--f-display);display:flex;gap:8px;align-items:center}
.gain svg{width:22px;height:22px;color:var(--gold)}
.res .actions{display:grid;gap:10px;width:100%;max-width:480px}
.newrec{color:var(--gold);font:800 20px var(--f-display)}
#confetti{position:fixed;inset:0;z-index:80;pointer-events:none;overflow:hidden}
#confetti i{position:absolute;top:-20px;width:10px;height:16px;border-radius:3px;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}
.flash-ok{animation:flashok .4s}.flash-bad{animation:shake .4s}
@keyframes flashok{50%{transform:scale(1.08)}}
@keyframes shake{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
.rm *,.rm *::before,.rm *::after{animation:none!important;transition:none!important}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
@media (max-height:700px){.mk{display:none}}
@media (max-height:640px){.eq{font-size:clamp(34px,11vw,52px)}.l-body{gap:8px}.hero{padding-top:6px}}

/* transitions et douceur */
.view-in{animation:viewin .34s cubic-bezier(.2,.8,.2,1)}
@keyframes viewin{from{opacity:0;transform:translateY(10px)}}
.view-in .stop{animation:stopin .55s cubic-bezier(.2,.9,.3,1.2) both;animation-delay:calc(var(--k,0)*55ms)}
@keyframes stopin{from{opacity:0;transform:translate(-50%,-38%) scale(.85)}}
.lesson.reveal{animation:reveal .55s cubic-bezier(.2,.8,.2,1)}
@keyframes reveal{from{clip-path:circle(0 at var(--ox,50%) var(--oy,50%))}to{clip-path:circle(160% at var(--ox,50%) var(--oy,50%))}}
.overlay.closing{animation:fadeout .24s ease-in forwards;pointer-events:none}
@keyframes fadeout{to{opacity:0}}
.qwrap{display:flex;flex-direction:column;align-items:center;gap:14px;width:100%}
.qin{animation:qin .3s cubic-bezier(.2,.8,.2,1)}
@keyframes qin{from{opacity:0;transform:translateX(26px)}}
.sheet.out{animation:down .19s ease-in forwards}
@keyframes down{to{transform:translateY(105%)}}
.l-input{transition:opacity .2s}
.l-input[inert]{opacity:.35}

/* retour sur erreur doux */
.sheet.help{background:var(--help-bg);color:var(--help-fg)}
.sheet.help .btn{background:var(--blue);box-shadow:0 5px 0 var(--blue-d)}
.sheet .btn.ghost2{background:transparent;color:var(--help-fg);box-shadow:none;border:2px solid var(--help-line)}
.sheet .btn.ghost2:active{transform:none}
.sheet .tx{min-width:0;flex:1}
.sheet .nudge{font-weight:800}
.sheet .expl{margin-top:6px}
.sheet .small2{font-size:14px;font-weight:700;margin-top:8px;opacity:.85}
.sheet .two{display:grid;grid-template-columns:1fr;gap:10px}
.sheet .viz{margin:0}
.blank.soft{border-color:#B7A9FF;border-style:solid;background:#2B2486;color:#fff}
.eq.wobble{animation:wob .45s ease-in-out}
@keyframes wob{20%{transform:rotate(-1.8deg)}60%{transform:rotate(1.8deg)}}
.hintcard{max-width:340px;width:100%;background:var(--surface);border:2px solid var(--gold);border-radius:18px;padding:10px 14px 12px;text-align:left;font-size:16px}
.hintcard p{margin:2px 0 0}
.hc-t{display:flex;align-items:center;gap:8px;color:var(--gold);font:800 15px var(--f-display);letter-spacing:.06em;text-transform:uppercase}
.hc-t svg{width:20px;height:20px}
.viz{display:flex;flex-wrap:wrap;gap:5px;margin-top:10px;justify-content:center;align-items:center}
.viz .d{width:16px;height:16px;border-radius:50%;background:var(--blue-l);display:inline-block}
.viz .d.r{background:var(--red-l)}
.viz .d.x{background:transparent;border:2px dashed currentColor;opacity:.6}
.viz .gap{width:8px}
.viz .gap.plus{width:auto;font:800 18px var(--f-display);padding:0 4px}
.viz.grid{display:grid;grid-template-columns:repeat(var(--c),16px);justify-content:center;gap:5px}

const ladProg=()=>Math.max(0,S.cr-S.ladBase);
function ladder(){
  let cum=0,prevCum=0;const prog=ladProg();let nextSet=false;

    let st=r.got?'got':prog>=cum?'ready':'lock';
    const isNext=!nextSet&&st==='lock';if(isNext)nextSet=true;
    return{r,i,cum,prevCum,st,next:isNext,left:Math.max(0,cum-prog),pct:st==='lock'?Math.max(0,Math.min(1,(prog-prevCum)/r.cost)):1};});
}

      if(!snap.exists){if(had&&(S.answered>0||S.xp>0||S.cr>0)){S.ts=S.ts||Date.now();push();}else SYNC='ok';updSync();return;}
      const rm=snap.data()||{},rts=Number(rm.ts)||0;
      if(rts>(S.ts||0)){if(!L)adopt(rm);SYNC='ok';}
      else if((S.ts||0)>rts){if(had)push();}
      else SYNC='ok';
      updSync();
    },()=>{SYNC='err';updSync();});
  }catch(e){}
}
document.addEventListener('visibilitychange',()=>{if(document.hidden&&pushT)push();else if(!document.hidden&&AUTH&&!pushT&&!pushing)sbSync(false);});
Object.assign(ACT,RWACT,ACCACT);

/* ---------- écran de connexion : obligatoire, adresse e-mail + mot de passe ---------- */
const GATED=!window.__NOGATE;
function showAuth(){
  closeSessionSafe();
  nav.hidden=true;nav.innerHTML='';
  view.innerHTML=`<div class="auth"><div class="auth-in"><div aria-hidden="true">${mascot('happy',96)}</div>
   <h1>Mission Calculo</h1>
   <p class="auth-sub">Connecte-toi pour retrouver ta progression sur tous tes appareils.</p>
   <form id="authf" novalidate>
    <div class="fld"><label for="acm">Adresse e-mail</label><input class="txt" id="acm" type="email" autocomplete="username" inputmode="email" autocapitalize="off" spellcheck="false" enterkeyhint="next"></div>
    <div class="fld"><label for="acp">Mot de passe</label><div class="pw"><input class="txt" id="acp" type="password" autocomplete="current-password" enterkeyhint="go"><button class="btn ghost sm" type="button" data-act="accshow" aria-pressed="false">Afficher</button></div></div>
    <p id="accmsg" role="alert"></p>
    <button class="btn" type="submit" id="accgo">Se connecter</button>
    <button class="btn ghost" type="button" data-act="accup">Créer un compte</button>
   </form></div></div>`;
  const f=$('#authf');if(f)f.addEventListener('submit',e=>{e.preventDefault();ACCACT.accin();});
}
function closeSessionSafe(){try{if(typeof closeSession==='function'&&L)closeSession();}catch(e){}}
async function enterApp(){
  if(S.owner&&S.owner!==AUTH.uid){S=defState();cleanRewards();}
  S.owner=AUTH.uid;
  await sbSync(true);
  if(S.owner!==AUTH.uid)S.owner=AUTH.uid;
  save();nav.hidden=false;renderNav();setTab('map',false);
}
/* ---------- changement d'adresse : transfert de la progression par lien ---------- */
const NEWURL='';
function b64url(o){return btoa(unescape(encodeURIComponent(JSON.stringify(o)))).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');}
function xferUrl(){try{return NEWURL+'#import='+b64url(S);}catch(e){return NEWURL;}}
function xferCard(){
  if(!NEWURL)return'';
  return`<div class="card xfer" role="region" aria-label="Nouvelle adresse"><b>Nouvelle adresse de Mission Calculo</b><p class="small" style="color:var(--fg)">L'application déménage. Touche le bouton pour emmener toute la progression d'Octave.</p><a class="btn sm" data-act="xfer" href="${xferUrl()}" target="_blank" rel="noopener">Transférer la progression</a><details><summary class="small">Le lien ne s'ouvre pas ?</summary><p class="small">Un parent peut copier ce lien à la main et l'ouvrir dans le navigateur.</p><textarea class="txt" readonly rows="3" style="width:100%" aria-label="Lien de transfert">${xferUrl()}</textarea></details></div>`;
}
ACT.xfer=el=>{el.href=xferUrl();};
let IMPORTED=false;
function importFromHash(){
  try{
    const m=/[#&]import=([A-Za-z0-9_-]+)/.exec(location.hash);if(!m)return;
    const o=JSON.parse(decodeURIComponent(escape(atob(m[1].replace(/-/g,'+').replace(/_/g,'/')))));
    try{history.replaceState(null,'',location.pathname+location.search);}catch(e){}
    if(!o||typeof o!=='object'||Array.isArray(o))return;
    ['stars','sk','facts','daily','crLog','crDay'].forEach(k=>{if(o[k]===null||typeof o[k]!=='object'||Array.isArray(o[k]))delete o[k];});
    ['lad','hist'].forEach(k=>{if(!Array.isArray(o[k]))delete o[k];});
    const mine=S.answered>0||S.xp>0||S.cr>0;
    if(mine&&(Number(o.ts)||0)<(S.ts||0))return;
    S=Object.assign(defState(),o);cleanRewards();save();IMPORTED=true;
  }catch(e){}
}
function toast(msg){const d=document.createElement('div');d.className='toast';d.setAttribute('role','status');d.textContent=msg;document.body.appendChild(d);setTimeout(()=>d.remove(),6000);}
importFromHash();
initSync();


/* ---------- démarrage ---------- */
applyMotion();
if(GATED&&!AUTH)showAuth();else{if(AUTH&&!S.owner)S.owner=AUTH.uid;renderNav();setTab('map',false);}
if(IMPORTED)toast('Progression d\'Octave transférée.');
window.__calculo={SKILLS,genTables,genDouble,genCompl,genAddEasy,genAddMid,genAddHard,genSubEasy,genSubHard,genMix,genTens,genHoles,genProblem,genBoss,genPlacement,makeChoices,state:()=>S,session:()=>L,reset:()=>{S=defState();cleanRewards();},ladder,grantCr,cleanRewards,sync:()=>SYNC};
})();
</script>
